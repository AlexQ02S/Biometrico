<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso Maestro - ISTS</title>
    <link rel="icon" href="https://superarse.edu.ec/assets/img/content/logo/superarse_gris.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background: radial-gradient(circle at top right, #4c1d95, #1a1a40, #000000);
            background-attachment: fixed;
            font-family: 'Plus Jakarta Sans', sans-serif;
            min-height: 100vh;
        }

        .modern-glass {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .dot-glow {
            box-shadow: 0 0 15px rgba(168, 85, 247, 0.8);
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }
        .animate-float { animation: float 4s ease-in-out infinite; }
        
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20% { transform: translateX(-10px); }
            40% { transform: translateX(10px); }
            60% { transform: translateX(-10px); }
            80% { transform: translateX(10px); }
        }
        .error-shake { animation: shake 0.4s ease-in-out; }

        .btn-hover {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .btn-hover:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px -5px rgba(168, 85, 247, 0.4);
        }
        .btn-hover:active { transform: scale(0.96); }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@200;400;600;700;800&display=swap" rel="stylesheet">
</head>
<body class="flex flex-col text-white select-none min-h-screen justify-between">

    <!-- Encabezado -->
    <header class="w-full bg-black/20 backdrop-blur-xl border-b border-white/5 py-4 px-6 md:px-10 flex justify-between items-center z-50 sticky top-0">
        <div class="flex items-center gap-3">
            <div class="p-2 bg-gradient-to-br from-purple-500 to-blue-600 rounded-xl shadow-lg">
                <img src="https://superarse.edu.ec/assets/img/content/logo/superarse_gris.png" alt="Logo ISTS" class="h-6 brightness-200">
            </div>
            <h1 class="text-base md:text-lg font-bold tracking-tight">ISTS <span class="bg-clip-text text-transparent bg-gradient-to-r from-purple-400 to-blue-400">FACE-ID</span></h1>
        </div>

        <div class="flex items-center gap-4">
            <div id="clock-header" class="hidden sm:block font-mono text-xs font-bold tracking-[0.2em] text-purple-300/80 bg-purple-500/10 px-3.5 py-1.5 rounded-full border border-purple-500/20">00:00:00</div>
            
            <!-- Botón de Inicio de Sesión Superior -->
            <a href="/login" class="btn-hover bg-white/10 hover:bg-white hover:text-slate-900 text-white text-xs font-extrabold px-4 md:px-5 py-2 rounded-full border border-white/20 flex items-center gap-2 transition-all">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 16l-4-4m0 0l4-4m-4 4h14m-5 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h7a3 3 0 013 3v1"></path></svg>
                <span>Iniciar Sesión</span>
            </a>
        </div>
    </header>

    <!-- Contenido Principal -->
    <main class="flex-1 flex flex-col items-center justify-center p-6 relative">
        <div class="z-10 w-full max-w-[420px] flex flex-col items-center">
            
            <!-- Reloj e Indicador -->
            <div class="text-center mb-6 animate-float">
                <div id="clock-large" class="text-6xl md:text-7xl font-extralight tracking-tighter mb-3">00:00</div>
                <div class="inline-flex items-center gap-2 bg-white/5 backdrop-blur-md px-4 py-1.5 rounded-2xl border border-white/10 shadow-xl">
                    <span class="flex h-2 w-2 relative">
                        <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-red-400 opacity-75"></span>
                        <span class="relative inline-flex rounded-full h-2 w-2 bg-red-500"></span>
                    </span>
                    <span class="text-[10px] font-bold uppercase tracking-[0.25em] text-gray-300">Autenticación Web Activa</span>
                </div>
            </div>

            <!-- Contenedor Principal del PIN -->
            <div id="pin-container" class="modern-glass w-full p-8 rounded-[3rem] text-center relative overflow-hidden flex flex-col items-center">
                <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-transparent via-purple-500 to-transparent opacity-50"></div>
                
                <div class="mb-4">
                    <div class="w-12 h-12 rounded-2xl bg-purple-500/10 border border-purple-500/30 flex items-center justify-center text-purple-400 mx-auto mb-3 shadow-inner">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>
                    </div>
                    <p class="text-xs uppercase tracking-[0.25em] font-extrabold text-purple-300/90">Código Maestro</p>
                    <p class="text-[11px] text-gray-400 mt-1">Ingresa tu PIN de 6 dígitos</p>
                </div>

                <!-- Input Oculto para capturar foco teclado móvil/físico -->
                <input type="password" id="hidden-input" maxlength="6" pattern="[0-9]*" inputmode="numeric" class="opacity-0 absolute -z-10 w-0 h-0" autofocus autocomplete="off">

                <!-- Indicador visual de los 6 dígitos -->
                <div id="pin-display" class="flex justify-center gap-3.5 h-6 items-center my-6 cursor-pointer" onclick="focusInput()">
                    <div class="w-4 h-4 rounded-full border-2 border-white/20 transition-all duration-300"></div>
                    <div class="w-4 h-4 rounded-full border-2 border-white/20 transition-all duration-300"></div>
                    <div class="w-4 h-4 rounded-full border-2 border-white/20 transition-all duration-300"></div>
                    <div class="w-4 h-4 rounded-full border-2 border-white/20 transition-all duration-300"></div>
                    <div class="w-4 h-4 rounded-full border-2 border-white/20 transition-all duration-300"></div>
                    <div class="w-4 h-4 rounded-full border-2 border-white/20 transition-all duration-300"></div>
                </div>

                <!-- Botón de Envío -->
                <button id="btn-submit" onclick="submitPin()" class="btn-hover w-full mt-2 bg-gradient-to-r from-purple-600 to-blue-600 hover:from-purple-500 hover:to-blue-500 py-3.5 rounded-2xl flex items-center justify-center font-extrabold text-xs tracking-widest uppercase transition-all duration-300 shadow-xl active:scale-95 disabled:opacity-50 border border-white/10">
                    <span>Ingresar con PIN</span>
                    <svg class="w-4 h-4 ml-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
                </button>
            </div>

            <!-- Botón de Inicio de Sesión Alternativo / Inferior -->
            <div class="mt-6 text-center">
                <img src="https://superarse.edu.ec/assets/img/content/logo/superarse_gris.png" alt="Logo ISTS" class="h-6 brightness-100">
            </div>

        </div>
    </main>

    <!-- Pie de Página -->
    <footer class="w-full py-5 flex justify-center items-center border-t border-white/5 bg-black/20">
        <div class="text-white/40 text-[11px] font-bold tracking-[0.35em] uppercase">SISTEMA BIOMÉTRICO ISTS &bull; ACCESO MAESTRO</div>
    </footer>

    <script>
        let currentPin = "";
        const hiddenInput = document.getElementById('hidden-input');

        function focusInput() {
            hiddenInput.focus();
        }

        // Foco automático respetando interacciones con otros elementos
        document.addEventListener('click', (e) => {
            if (!e.target.closest('a') && !e.target.closest('button')) {
                focusInput();
            }
        });
        window.addEventListener('load', focusInput);

        // Reloj
        function updateClock() {
            const now = new Date();
            document.getElementById('clock-header').innerText = now.toLocaleTimeString('es-EC');
            document.getElementById('clock-large').innerText = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        }
        setInterval(updateClock, 1000);
        updateClock();

        // Escuchar la entrada en el input oculto
        hiddenInput.addEventListener('input', (e) => {
            currentPin = e.target.value.replace(/[^0-9]/g, '');
            hiddenInput.value = currentPin;
            renderPin();

            if (currentPin.length === 6) {
                submitPin();
            }
        });

        // Captura de teclas especiales
        document.addEventListener('keydown', function(event) {
            if (event.key === 'Escape') {
                clearPin();
            } else if (event.key === 'Enter') {
                submitPin();
            }
        });

        function clearPin() {
            currentPin = "";
            hiddenInput.value = "";
            renderPin();
        }

        function renderPin() {
            const display = document.getElementById('pin-display');
            display.innerHTML = "";
            for (let i = 0; i < 6; i++) {
                const dot = document.createElement('div');
                if (i < currentPin.length) {
                    dot.className = "w-4 h-4 rounded-full bg-gradient-to-r from-purple-400 to-blue-400 dot-glow scale-110 transition-all duration-300";
                } else {
                    dot.className = "w-4 h-4 rounded-full border-2 border-white/20 transition-all duration-300";
                }
                display.appendChild(dot);
            }
        }

        function submitPin() {
            if (currentPin.length < 6) {
                const container = document.getElementById('pin-container');
                container.classList.add('error-shake');
                setTimeout(() => container.classList.remove('error-shake'), 400);
                return;
            }

            fetch('/verificar_acceso_maestro', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ pin: currentPin })
            })
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    window.location.href = data.redirect || "/index";
                } else {
                    const container = document.getElementById('pin-container');
                    container.classList.add('error-shake', 'border-red-500/50');
                    setTimeout(() => {
                        container.classList.remove('error-shake', 'border-red-500/50');
                        clearPin();
                    }, 400);
                }
            })
            .catch(err => {
                console.error(err);
                clearPin();
            });
        }
    </script>
</body>
</html>
